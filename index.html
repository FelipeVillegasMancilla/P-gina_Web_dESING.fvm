<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dESIGN.FVM — Felipe Villegas</title>
<meta name="description" content="Portafolio personal de Felipe Villegas Mancilla, estudiante de Ingeniería en Diseño e Ingeniería Comercial.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Source+Code+Pro:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     COLORES Y MEDIDAS — cambia aquí y se actualiza todo el sitio
     (sacados del template de InDesign Página_Portafolio: 1440 px de ancho)
     ========================================================= */
  :root{
    --fondo:#292929;        /* fondo de la página */
    --barra:#404040;        /* barra superior con dESIGN.FVM */
    --casilla:#393939;      /* fondo de los cuadrantes */
    --borde:#F1F0DF;        /* borde de los cuadrantes */
    --texto:#FFFFFF;        /* textos principales */
    --texto-suave:#BDBDBD;  /* títulos de cuadrantes y bajada */
    --mono:"Source Code Pro", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --sans:"Inter", "Acumin Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--mono);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  img{max-width:100%;display:block}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
  a:focus-visible,button:focus-visible,summary:focus-visible{outline:1px solid var(--texto);outline-offset:4px}

  /* ---------- Barra superior ---------- */
  .barra{height:58px;display:grid;place-items:center;background:var(--barra)}
  .marca{font-family:var(--sans);font-size:20px;font-weight:400;letter-spacing:.01em}

  /* ---------- Portada con foto ---------- */
  .portada{position:relative;aspect-ratio:1440/307;overflow:hidden;background:#9e9e9d}
  .portada img{width:100%;height:100%;object-fit:cover;object-position:60% 50%;filter:brightness(.68)}
  .nombre{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:#000;text-transform:uppercase;font-weight:400}
  .nombre h1,.nombre p{font:inherit;margin:0}

  /* ---------- Cuadrantes ---------- */
  .trabajos{display:grid;grid-template-columns:repeat(4,1fr)}
  .trabajo{position:relative;height:450px;overflow:hidden;background:var(--casilla);box-shadow:inset 0 0 0 1px var(--borde);text-align:left;display:block;width:100%}
  .trabajo:disabled{cursor:default}
  .trabajo img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
  .trabajo .area{position:absolute;top:26px;left:20px;right:20px;text-transform:uppercase;color:var(--texto-suave);font-weight:400}
  .trabajo.con-foto .area{color:var(--texto);text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .trabajo .rotulo{position:absolute;inset:auto 0 0 0;padding:20px;background:linear-gradient(transparent,rgba(20,20,20,.85));text-transform:uppercase;font-size:14px;opacity:0;transition:opacity .25s}
  .trabajo .rotulo span{display:block;color:var(--texto-suave);font-weight:300}
  .trabajo:not(:disabled):hover img{transform:scale(1.03)}
  .trabajo:hover .rotulo,.trabajo:focus-visible .rotulo{opacity:1}

  .bajada{margin:68px 0 0;text-align:center;text-transform:uppercase;color:var(--texto-suave);padding:0 16px}

  /* ---------- Otros: filas desplegables ---------- */
  .otros{padding:204px 30px 0}
  .otros h2{font:inherit;text-align:center;margin:0 0 20px}
  .fila{border:1px solid var(--texto);margin-bottom:46px}
  .fila summary{list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:53px;padding:0 33px 0 15px;text-transform:uppercase;cursor:pointer}
  .fila summary::-webkit-details-marker{display:none}
  .fila summary::after{content:"";width:1px;height:29px;background:var(--texto);transition:transform .25s}
  .fila[open] summary::after{transform:rotate(90deg)}
  .fila .contenido{padding:0 15px 20px;color:var(--texto-suave);font-weight:300}
  .fila .contenido p{margin:0}

  /* ---------- Contacto ---------- */
  .contacto{padding:165px 16px 0;text-align:center}
  .correo{font-size:20px}
  .correo:hover{text-decoration:underline;text-underline-offset:6px}
  .copiado{display:block;min-height:24px;margin-top:4px;font-size:14px;color:var(--texto-suave)}
  .redes{display:flex;justify-content:center;flex-wrap:wrap;gap:16px 120px;list-style:none;padding:0;margin:22px 0 0}
  .redes a:hover{text-decoration:underline;text-underline-offset:6px}
  footer{padding:77px 16px 32px}

  /* ---------- Ventana de trabajo ---------- */
  dialog{border:1px solid var(--borde);padding:0;width:min(760px,100% - 32px);max-height:88vh;background:var(--fondo);color:var(--texto);font-family:var(--mono)}
  dialog::backdrop{background:rgba(0,0,0,.7)}
  .ficha{padding:40px}
  .ficha img{margin:0 0 32px;width:100%}
  .cerrar{float:right;text-transform:uppercase;font-size:14px;color:var(--texto-suave)}
  .cerrar:hover{color:var(--texto)}
  .ficha h3{font-size:20px;font-weight:500;text-transform:uppercase;margin:0 0 4px}
  .ficha .meta{color:var(--texto-suave);font-weight:300;margin:0 0 32px;text-transform:uppercase;font-size:14px}
  .ficha h4{font-size:14px;font-weight:400;text-transform:uppercase;margin:32px 0 8px}
  .ficha p,.ficha li{color:var(--texto-suave);font-weight:300}
  .ficha p{margin:0}
  .ficha ol{margin:0;padding-left:24px}

  /* ---------- Pantallas medianas y celular ---------- */
  @media (max-width:900px){
    .trabajos{grid-template-columns:repeat(2,1fr)}
    .trabajo{height:360px}
    .otros{padding:120px 16px 0}
    .redes{gap:16px 64px}
  }
  @media (max-width:760px){
    .portada{aspect-ratio:auto;height:220px}
    .nombre{font-size:13px;left:16px}
    .trabajos{grid-template-columns:1fr}
    .trabajo{height:300px}
    .trabajo .rotulo{opacity:1}
    .bajada{font-size:14px}
    .otros{padding-top:96px}
    .fila{margin-bottom:24px}
    .fila summary{font-size:14px;padding-right:20px;gap:16px}
    .contacto{padding-top:96px}
    .correo{font-size:17px}
    .redes{gap:16px 32px}
    .ficha{padding:24px}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *{transition:none!important}
  }
</style>
</head>
<body>

<header>
  <div class="barra"><a class="marca" href="#">dESIGN.FVM</a></div>
  <div class="portada">
    <img src="img/portada-silla.jpg" alt="Silla roja de madera curvada">
    <div class="nombre">
      <h1>Felipe Villegas</h1>
      <p>Estudiante Ing Diseño – Ing Comercial</p>
    </div>
  </div>
</header>

<main>
  <section id="trabajos" aria-label="Trabajos">
    <div class="trabajos" id="lista"></div>
    <p class="bajada">Portafolio personal de Ingeniería en Diseño/Industrial</p>
  </section>

  <section class="otros" aria-labelledby="otros-titulo">
    <h2 id="otros-titulo">Otros</h2>
    <div id="otros"></div>
  </section>

  <section id="contacto" class="contacto" aria-label="Contacto">
    <button class="correo" id="correo"></button>
    <span class="copiado" id="copiado" aria-live="polite"></span>
    <ul class="redes">
      <li><a href="#">Instagram</a></li>
      <li><a href="#">CV</a></li>
      <li><a href="#">Linkedin</a></li>
    </ul>
  </section>
</main>

<footer></footer>

<dialog id="ventana"><div class="ficha" id="ficha"></div></dialog>

<script>
/* =========================================================
   CONTENIDO EDITABLE
   Cada cuadrante es un área. "area" es el título que se ve arriba,
   "titulo" es el trabajo que se muestra dentro. "imagen" es la ruta
   de la foto dentro de la carpeta img/ (déjalo vacío si aún no hay).
   ========================================================= */
const TRABAJOS = [
  { area:"Oficio", titulo:"", imagen:"" },
  { area:"Fab digital", titulo:"Trabajo 1", tipo:"Fabricación digital", anio:"2026", imagen:"img/trabajo-1.png",
    desafio:"PENDIENTE: ¿qué problema o pregunta había detrás de esta pieza?",
    proceso:["PENDIENTE: paso 1","PENDIENTE: paso 2","PENDIENTE: paso 3"],
    resultado:"PENDIENTE: cómo quedó y qué aprendiste." },
  { area:"Conceptualización", titulo:"", imagen:"" },
  { area:"Escala", titulo:"", imagen:"" }
];

/* Filas de "Otros": cada una se despliega al hacer clic. */
const OTROS = [
  { titulo:"Registro de video de proceso de fabricación", texto:"PENDIENTE: videos del proceso." },
  { titulo:"Fotografía", texto:"PENDIENTE: fotografías." },
  { titulo:"Manufactura personal", texto:"PENDIENTE: piezas hechas a mano." }
];

const CORREO = "pipevillegasm@gmail.com";

/* =========================================================
   FUNCIONAMIENTO — no necesitas editar debajo de esta línea
   ========================================================= */
const lista = document.getElementById("lista");
TRABAJOS.forEach((t,i)=>{
  const b = document.createElement("button");
  b.className = "trabajo";
  if(t.imagen){
    b.classList.add("con-foto");
    b.innerHTML = `<img src="${t.imagen}" alt="${t.titulo || t.area}" loading="lazy">
      <div class="rotulo">${t.titulo}<span>${[t.tipo,t.anio].filter(Boolean).join(" · ")}</span></div>`;
  }
  b.insertAdjacentHTML("beforeend", `<span class="area">${t.area}</span>`);
  if(t.desafio) b.addEventListener("click", ()=>abrir(i)); else b.disabled = true;
  lista.appendChild(b);
});

document.getElementById("otros").innerHTML = OTROS.map(o=>
  `<details class="fila"><summary>${o.titulo}</summary><div class="contenido"><p>${o.texto}</p></div></details>`
).join("");

const ventana = document.getElementById("ventana");
const ficha = document.getElementById("ficha");
function abrir(i){
  const t = TRABAJOS[i];
  ficha.innerHTML = `<button class="cerrar" id="cerrar">Cerrar</button>
    <h3>${t.titulo}</h3>
    <p class="meta">${[t.area,t.tipo,t.anio].filter(Boolean).join(" · ")}</p>
    ${t.imagen ? `<img src="${t.imagen}" alt="">` : ""}
    <h4>Desafío</h4><p>${t.desafio}</p>
    <h4>Proceso</h4><ol>${t.proceso.map(s=>`<li>${s}</li>`).join("")}</ol>
    <h4>Resultado</h4><p>${t.resultado}</p>`;
  document.getElementById("cerrar").addEventListener("click", ()=>ventana.close());
  ventana.showModal();
}
ventana.addEventListener("click", e=>{ if(e.target===ventana) ventana.close(); });

const correo = document.getElementById("correo");
const copiado = document.getElementById("copiado");
correo.textContent = CORREO;
correo.addEventListener("click", async ()=>{
  try{ await navigator.clipboard.writeText(CORREO); copiado.textContent = "Correo copiado"; }
  catch{ window.location.href = "mailto:"+CORREO; }
  setTimeout(()=>copiado.textContent="", 2500);
});
</script>
</body>
</html>
